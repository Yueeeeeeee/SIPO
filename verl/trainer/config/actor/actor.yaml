# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Target class for this configuration
_target_: verl.workers.config.ActorConfig

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

# the abstract actor configs
# fsdp, fsdp2 or megatron. must be set.
strategy: ???

# Split each sample into sub-batches of this size for PPO
ppo_mini_batch_size: 256

# [Deprecated] Global micro batch size
ppo_micro_batch_size: null

# Local per-GPU micro batch size
ppo_micro_batch_size_per_gpu: null

# Whether to automatically adjust batch size at runtime
# oc.select: the default val for ref.log_prob_use_dynamic_bsz
use_dynamic_bsz: false

# Max tokens per GPU in one PPO batch; affects gradient accumulation
# Typically it should be: n * ${data.max_prompt_length} + ${data.max_response_length}
# oc.select: the default val for ref.log_prob_max_token_len_per_gpu
ppo_max_token_len_per_gpu: 16384

# PPO clip ratio
clip_ratio: 0.2

# Lower bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_low: 0.2

# Upper bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_high: 0.2

# Positive and negative tau for smoothing function in SAPO (https://arxiv.org/pdf/2511.20347)
# default values used in the paper with Qwen3-30B-A3B-Base
tau_pos: 1.0

# negative tau for smoothing function in SAPO
tau_neg: 1.05

# Whether to freeze vision model, if set true, it will be freeze vision model
freeze_vision_tower: false

# policy loss config
policy_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.PolicyLossConfig

  # Loss function mode: vanilla / clip-cov / kl-cov / gpg / sdpo / sipo
  loss_mode: "vanilla"

  # Ratio of tokens to be clipped for clip-cov loss
  clip_cov_ratio: 0.0002

  # Lower bound for clip-cov loss
  clip_cov_lb: 1.0

  # Upper bound for clip-cov loss
  clip_cov_ub: 5.0

  # Ratio of tokens to be applied kl penalty for kl-cov loss
  kl_cov_ratio: 0.0002

  # KL divergence penalty coefficient
  ppo_kl_coef: 0.1

# self-distillation config
self_distillation:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.SelfDistillationConfig

  # Distillation is enabled when policy_loss.loss_mode is "sdpo" or "sipo"

  # Whether to use full-logit KL distillation
  full_logit_distillation: True

  # Top-k for logit distillation; null uses full logits
  distillation_topk: 100

  # Whether to add a tail bucket when using distillation_topk
  distillation_add_tail: True

  # KL interpolation coefficient: 0.0=forward KL, 1.0=reverse KL, in-between=JSD
  alpha: 0.5 

  # Weight for the SIPO divergence/distillation term
  beta: 1.0

  # Minimum sequence reward to be considered successful
  success_reward_threshold: 0.5

  # Teacher regularization method: "ema", "trust-region", or "student"
  teacher_regularization: ema

  # EMA update rate for teacher weights, or trust-region mixing coefficient
  teacher_update_rate: 0.05 

  # Maximum length of the reprompted prompt
  max_reprompt_len: 8192

  # Truncation method for the reprompted prompt (recommended to use "right" or "error")
  reprompt_truncation: right # "left", "right", "error"

  # Whether to not reprompt on self-success
  dont_reprompt_on_self_success: True

  # Whether to remove <think>...</think> tags from successful demonstrations before reprompting
  remove_thinking_from_demonstration: True

  # Whether a rollout that SUCCEEDED gets a sibling's incorrect attempt as teacher context.
  # True reproduces the behaviour this repo had when the flag was unread. False matches the
  # SIPO repo, which gives successful rollouts no context at all. Failed rollouts take a
  # successful peer's solution either way.
  include_incorrect_attempt: True

  # Whether to include environment feedback in reprompting
  # If True and feedback exists: use it with incorrect peer attempts or when no solution is available
  include_environment_feedback: True

  # If True, only use feedback when no solution is available (ignore feedback when solution exists)
  # Requires include_environment_feedback=True to have any effect
  environment_feedback_only_without_solution: True

  # IS clip for loss; null disables IS weighting
  is_clip: 2

  # --- REINFORCE-form distillation advantage (opt-in; replaces the analytic divergence) ---
  # RLSD (arXiv:2604.03128). Drops the divergence term; the teacher, which has seen the
  # privileged context r, reweights the reward advantage within each rollout:
  #   A_d = log pi_teacher(y_t | x, r) - log pi_student(y_t | x)
  #   A_t = A_r * ((1 - lam) + lam * clip(exp(sign(A_r) * A_d), 1 - sipo_eps, 1 + sipo_eps))
  # The verifier alone sets the direction; the teacher moves at most +-sipo_eps of credit
  # between tokens; rows with A_r = 0 stay 0. Requires alpha=1.0 and
  # full_logit_distillation=False, and is the only distillation form that runs with
  # model.use_fused_kernels=True.
  reinforce_advantage: False
  sipo_eps: 0.2
  # lam decays linearly from sipo_lambda_start to 0 over sipo_lambda_steps steps, after which
  # the update is plain GRPO (paper: 0.5 over 50). sipo_lambda_start=0 is GRPO with A_d logged.
  sipo_lambda_start: 0.5
  sipo_lambda_steps: 50
  # What the weight is built from. "opd": RLSD as published, e = log pi_T(y|x,gold) - log pi_S(y|x),
  # which is lam*|A_r| times the on-policy-distillation gradient toward "act as if you knew the
  # answer". "contrastive": e = log pi_T(y|x,gold) - log pi_T(y|x,wrong), the wrong answer being
  # the group's most common wrong final answer; both sides are answer-conditioned, so the
  # decisiveness prior cancels and e is nonzero only on answer-specific tokens. One extra
  # teacher forward per micro batch.
  sipo_evidence: opd
  # "confidence": build the weight from A_d minus its mean over tokens of the same student
  # confidence (7 buckets on log p_S, EMA-smoothed across micro batches) instead of the raw
  # log-ratio. E[A_d] = -KL_t is most negative where the student is least sure, so the raw
  # ratio under sign(A_r) is a push against exploration whatever the outcome -- the mechanism
  # behind every flat run here. The centred evidence is zero-mean at every confidence level.
  sipo_baseline: none
  sipo_baseline_ema: 0.1
  # Reweight wrong rollouts only (reference repo flag); correct rollouts keep uniform credit.
  sipo_negative_only: False
  # > 0: additive contrastive credit on all-wrong groups. Their A_r is 0, so the multiplicative
  # reweighting leaves them at 0; with this on each of their rollouts gets
  #     A_t = sipo_all_wrong_kappa * clip(e_t, -sipo_eps, +sipo_eps),
  # a constant. Scale to set it by: a wrong rollout in a mixed group gets lam*|A_r|*e_t from
  # the teacher, and all_wrong/c logs the batch's mean |A_r| over those rollouts (about 0.3
  # early on), so lam*c, about 0.15, is the same teacher term without the constant -c that
  # imputation added. Keep sipo_all_wrong_kappa * sipo_eps below 1/G so the additive form can
  # never flip a sign on a mixed row. Needs sipo_evidence=contrastive (the wrong answer comes
  # from the group's own rollouts). Mixed groups keep the multiplicative form; all-correct
  # groups stay at 0.
  sipo_all_wrong_kappa: 0.0
  # Which wrong answer the second teacher is shown (sipo_evidence=contrastive). "own": a wrong
  # rollout is contrasted against its own parseable final answer, the answer it actually
  # committed to; correct, truncated or gold-equal rows use the group's most common wrong
  # answer. "mode": every row uses the group mode (the first contrastive run).
  sipo_contrast_negative: own
  # What the two teachers are conditioned on. answer: the gold answer vs a wrong answer in the
  # gold block (math, gpqa / sciknoweval, tooluse; the ground truth is rendered in the scorer's
  # own "pred" format so the two prompts differ only in content). trajectory: a successful
  # sibling rollout vs a failed sibling rollout under the same solution_template, each
  # excluding the row itself, gold block unused; for tasks with no answer to show, such as code.
  # Rows lacking either sibling (all-wrong and all-correct groups) get no contrast there.
  # auto: the trajectory pair where both siblings exist, else the answer pair, so all-wrong
  # groups keep their contrast (gold vs their own wrong answers; needs gold_answer_for_all).
  sipo_contrast_context: answer
  # A WRONG rollout without a valid judged answer of its own (truncated, outside the verifier's
  # window, malformed) has no matched negative. skip: no teacher term for it. mode: fall back to
  # the group's most common wrong answer (runs before 2026-09-23). Correct rollouts use the mode.
  sipo_contrast_unjudged: skip
  # How the evidence enters the advantage. multiplicative: RLSD / CEPO,
  #     A_t = A_r * ((1-lam) + lam * clip(exp(sign(A_r)*e_t), 1-eps, 1+eps)),
  # first order A_r + lam*|A_r|*e_t, so the teacher term scales with |A_r| and is 0 on all-wrong
  # groups unless sipo_all_wrong_kappa adds it. additive: RLCSD's form for EVERY row,
  #     A_t = A_r + sipo_kappa * clip(e_t, -sipo_eps, +sipo_eps),
  # the same constant on a 1-of-8 group's wrong rollouts (multiplicative gives them lam/8) and
  # on an all-wrong group (multiplicative: 0); a sign-preserving clamp keeps sign(A_t) =
  # sign(A_r) on mixed rows and cannot engage while sipo_kappa*sipo_eps < 1/G (sipo/clamp_frac
  # reports if it does). Needs sipo_evidence=contrastive and sipo_all_wrong_kappa=0; lam unused.
  sipo_form: multiplicative
  sipo_kappa: 0.0
  # Every row's teacher sees the dataset's final answer as r (RLSD's setup). Off: the SIPO
  # context, a successful sibling rollout where one exists.
  gold_answer_for_all: False
  # Wording follows the reference implementation's teacher_hint_self_distill.jinja, which
  # presents the final answer as "a reference solution" and asks for the model's own approach.
  gold_answer_template: "Here is a reference solution:\n{gold_answer}\n\nAfter understanding the reference solution, please try to solve this problem using your own approach below.\n\n---\n\n"
  # teacher_regularization=periodic: copy the student into the teacher every N steps and
  # freeze it in between (paper: 10).
  teacher_sync_every: 10
  # Every N steps rank 0 prints one row of the reweighting token by token (0 = off).
  debug_print_every: 1
  # Group-relative advantages are 0 on a group whose rollouts all scored the same (34-50% of
  # rows here), so GRPO learns nothing from the problems it is stuck on. With this on, every
  # rollout of an all-wrong group gets A = -impute_wrong_scale * c, c = this batch's mean |A|
  # over the wrong rollouts of mixed groups, and all-correct groups get +impute_correct_scale
  # * c (default 0). The RLSD reweighting is then applied ONLY to those rows -- on mixed
  # groups it was measured to cancel GRPO's own progress -- so mixed groups stay GRPO.
  impute_group_advantage: False
  impute_wrong_scale: 1.0
  impute_correct_scale: 0.0

  # Student prompt suffix appended during preprocessing; stripped from teacher reprompt input
  student_reasoning_suffix: "\n\nPlease reason step by step before generating your final answer."

  # Reprompting template - available variables: prompt, solution, incorrect_attempt, feedback
  reprompt_template: "{prompt}{solution}{incorrect_attempt}{feedback}\n\nUse the context above to solve the original question correctly. If an incorrect attempt or feedback is shown, avoid the identified error. Please reason step by step before generating your final answer."

  # Solution template - available variables: successful_previous_attempt
  solution_template: "\n\n# Successful reference solution:\n\n{successful_previous_attempt}"

  # Incorrect peer attempt template - available variables: incorrect_attempt
  incorrect_attempt_template: "\n\n# Incorrect reference attempt:\n\n{incorrect_attempt}"

  # Feedback template - available variables: feedback_raw
  feedback_template: "\n\n# Environment feedback for the incorrect reference attempt:\n\n{feedback_raw}"

# Constant C in Dual-clip PPO; clips when advantage < 0 and ratio > C
clip_ratio_c: 3.0

# Loss aggregation mode: "token-mean", "seq-mean-token-sum", "seq-mean-token-mean", or "seq-mean-token-sum-norm"
loss_agg_mode: token-mean

# Scale factor for "seq-mean-token-sum-norm" loss aggregation mode.
# If null, uses response_length. Set to a constant to ensure consistent normalization.
loss_scale_factor: null

# Entropy regularization coefficient in PPO loss
entropy_coeff: 0

# When true, the actor forward will request entropy from the model
calculate_entropy: false

# Whether to use KL loss instead of KL reward penalty. True for GRPO
use_kl_loss: false

# Whether to enable PrefixGrouper shared-prefix forward
use_prefix_grouper: false

# Whether to use torch.compile()
# oc.select: the default val for ref.use_torch_compile
use_torch_compile: true

# KL loss coefficient when use_kl_loss is enabled. For GRPO
kl_loss_coef: 0.001

# Type of KL divergence loss. Options: "kl"(k1), "abs", "mse"(k2), "low_var_kl"(k3), "full"
kl_loss_type: low_var_kl

# Number of PPO epochs per batch
ppo_epochs: 1

# Shuffle training data across PPO epochs
shuffle: false

# The seed used to construct mini-batch
data_loader_seed: 42

# checkpoint configs
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.trainer.config.CheckpointConfig

  # What to include in saved checkpoints
  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
  save_contents: ['model', 'optimizer', 'extra']

  # For more flexibility, you can specify the contents to load from the checkpoint.
  # .xxx refers to the local variable xxx from the same level of hierarchy similar to python pkg
  load_contents: ${.save_contents}

  # Whether to save checkpoints asynchronously. Only effective for Megatron as of now.
  async_save: False

# optimizer configs
optim:

  # Learning rate
  lr: 1e-6

  # Warmup steps ratio (used if lr_warmup_steps is 0 or negative)
  lr_warmup_steps_ratio: 0.0

  # Total training steps (must be overridden at runtime)
  total_training_steps: -1

  # Weight decay
  weight_decay: 0.01

  # Prioritized. None, 0 or Negative values mean delegating to lr_warmup_steps_ratio.
  lr_warmup_steps: -1


# Whether to use custom fused kernels (e.g., FlashAttention, fused MLP)
use_fused_kernels: ${oc.select:actor_rollout_ref.model.use_fused_kernels,false}

# profile the actor model in `update_policy`
profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # profiler tool, default same as profiler.tool in global config
  # choices: nsys, npu, torch
  tool: ${oc.select:global_profiler.tool,null}

  # whether enable profile on Actor
  enable: False

  # Whether to profile all ranks.
  all_ranks: False

  # The ranks that will be profiled. [] or [0,1,...]
  ranks: []

  # profile results saving path
  save_path: ${oc.select:global_profiler.save_path,null}

  # specific tool config which only related to the role
  tool_config:

    # nsys tool config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}

    # npu config
    npu:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NPUToolConfig

      # Contents to profile, can be empty
      # options: npu, cpu, memory, shapes, module, stack
      contents: []

      # Collection level, optional values: level_none, level0, level1, level2.
      level: "level0"

      # Whether to automatically parse the data.
      analysis: True

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False

    # torch profiler config
    torch:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      # start profile mini-batch in training
      # NOTICE: different with global steps config which refers to iteration
      # This field only related with mini-batch
      step_start: 0

      # stop profile mini-batch in training
      step_end: null

    # torch memory profiler config
    torch_memory:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchMemoryToolConfig

      # Maximum number of memory allocation entries to track
      trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

      # Stack trace depth for memory allocations
      stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

# Router replay configuration for MoE models
router_replay:

  # Target dataclass for this configuration
  _target_: verl.workers.config.RouterReplayConfig

  # Router replay mode: disabled, R2, R3
  # - R2: Use R2 routing strategy (record mode)
  # - R3: Use R3 routing strategy (record mode)
  mode: disabled

  # File path to save recorded routing decisions
  # Required when mode is 'record', 'R2', or 'R3'
  record_file: null

  # File path to load recorded routing decisions for replay
  # Required when mode is 'replay'
  replay_file: null
